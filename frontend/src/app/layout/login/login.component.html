<div class="login-page">
  <div class="login-overlay"></div>

  <div class="login-card">
    <!-- IMAGEN DEL AUTO DEPORTIVO -->
    <div class="login-logo">
      <img src="/car-logo.png" alt="DemonCar" class="car-logo-img" />
    </div>

    <h1 class="login-title">DemonCar</h1>
    <p class="login-subtitle">Taller Automotriz</p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label">Correo electrónico</label>
        <div class="input-wrapper">
          <i class="bi bi-envelope input-icon"></i>
          <input
            type="email"
            class="form-input"
            placeholder="correo@ejemplo.com"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <div class="input-wrapper">
          <i class="bi bi-lock input-icon"></i>
          <input
            [type]="mostrarPassword() ? 'text' : 'password'"
            class="form-input"
            placeholder="••••••••"
            [(ngModel)]="password"
            name="password"
            required
          />
          <button
            type="button"
            class="input-icon-right"
            (click)="togglePassword()"
            tabindex="-1"
          >
            <i class="bi" [class]="mostrarPassword() ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
      </div>

      @if (error()) {
        <div class="error-box">
          <i class="bi bi-exclamation-triangle-fill"></i> {{ error() }}
        </div>
      }

      <button
        type="submit"
        class="btn-login"
        [disabled]="cargando()"
      >
        @if (cargando()) {
          <span class="spinner-border spinner-border-sm me-2"></span>
          Ingresando...
        } @else {
          <i class="bi bi-box-arrow-in-right me-2"></i>
          Iniciar sesión
        }
      </button>
    </form>

    <div class="login-footer">
      <i class="bi bi-info-circle"></i>
      Usuario: admin&#64;taller.com / admin123
    </div>
  </div>
</div>
