<div class="app-container">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <i class="bi bi-tools"></i> DemonCar
    </div>

    <ul class="sidebar-menu">
      @for (item of menuItems; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="active"
          >
            <i class="bi" [class]="item.icon"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>

    <div class="sidebar-footer p-3 border-top border-secondary border-opacity-25">
      <small class="text-muted d-block">
        <i class="bi bi-person-circle"></i>
        {{ authService.usuario()?.nombre }}
      </small>
      <small class="text-muted d-block mt-1">
        <span class="badge bg-danger">{{ authService.usuario()?.rol }}</span>
      </small>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <!-- TOPBAR -->
    <header class="topbar">
      <div class="d-flex align-items-center gap-2">
        <h5 class="m-0 fw-semibold">Taller Automotriz</h5>
      </div>

      <div class="d-flex align-items-center gap-3">
        <span class="text-muted d-none d-md-inline">
          <i class="bi bi-calendar3"></i>
          {{ hoy | date:'dd/MM/yyyy' }}
        </span>

        <div class="dropdown">
          <button
            class="btn btn-light dropdown-toggle d-flex align-items-center gap-2"
            data-bs-toggle="dropdown"
          >
            <i class="bi bi-person-circle fs-5"></i>
            <span class="d-none d-md-inline">{{ authService.usuario()?.nombre }}</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><h6 class="dropdown-header">{{ authService.usuario()?.email }}</h6></li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <button class="dropdown-item text-danger" (click)="cerrarSesion()">
                <i class="bi bi-box-arrow-right"></i> Cerrar sesión
              </button>
            </li>
          </ul>
        </div>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <div class="page-content">
      <router-outlet />
    </div>
  </main>
</div>
